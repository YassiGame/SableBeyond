plugins {
    id 'com.gradleup.shadow'
}

def modmenuEnabled = providers.gradleProperty("modmenu_enabled").map { it.toBoolean() }.getOrElse(false)

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}")
    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    if (modmenuEnabled) {
        modRuntimeOnly("com.terraformersmc:modmenu:${modmenu_version}")
    }
    modImplementation("dev.ryanhcode.sable:sable-fabric-${minecraft_version}:${sable_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.releaseChangelog
    type = providers.gradleProperty("release_type").map { releaseType -> me.modmuss50.mpp.ReleaseType.of(releaseType) }.get()
    displayName = "fabric${rootProject.minecraft_version}+v${project.version}"
    modLoaders.add("fabric")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = providers.gradleProperty("modrinth_project_id")
        minecraftVersions.add(rootProject.minecraft_version)

        requires("sable")
        embeds("cloth-config")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = providers.gradleProperty("curseforge_project_id")
        projectSlug = providers.gradleProperty("curseforge_project_slug")
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true

        requires("sable")
        embeds("cloth-config")
    }
}
