plugins {
    id 'com.github.johnrengelman.shadow'
}

def jadeEnabled = providers.gradleProperty("jade_enabled").map { it.toBoolean() }.getOrElse(true)
def aeronauticsEnabled = providers.gradleProperty("aeronautics_enabled").map { it.toBoolean() }.getOrElse(true)
def sliceAndDiceEnabled = providers.gradleProperty("slice_and_dice_enabled").map { it.toBoolean() }.getOrElse(true)
def catalogueEnabled = providers.gradleProperty("catalogue_enabled").map { it.toBoolean() }.getOrElse(true)



architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    if (jadeEnabled) {
        runtimeOnly("maven.modrinth:jade:${jade_version}+neoforge")
    }
    if (aeronauticsEnabled) {
        runtimeOnly("maven.modrinth:create-aeronautics:${aronautics_version}+mc${minecraft_version}")
    }
    if (sliceAndDiceEnabled) {
        runtimeOnly("maven.modrinth:slice-and-dice:${slice_and_dice_version}-neoforge,${minecraft_version}")
    }

    implementation("maven.modrinth:kotlin-for-forge:NrSebcsG")
    compileOnly("maven.modrinth:slice-and-dice:${slice_and_dice_version}-neoforge,${minecraft_version}")

    api ("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")

    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    if (catalogueEnabled) {
        runtimeOnly "curse.maven:catalogue-459701:${catalogue_version}"
    }

    compileOnlyApi("dev.latvian.mods:kubejs-neoforge:$kubejs_version")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.releaseChangelog
    type = providers.gradleProperty("release_type").map { releaseType -> me.modmuss50.mpp.ReleaseType.of(releaseType) }.get()
    displayName = "neoforge${rootProject.minecraft_version}+v${project.version}"
    modLoaders.add("neoforge")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = providers.gradleProperty("modrinth_project_id")
        minecraftVersions.add(rootProject.minecraft_version)

        requires("sable", "create")
        embeds("cloth-config")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = providers.gradleProperty("curseforge_project_id")
        projectSlug = providers.gradleProperty("curseforge_project_slug")
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true

        requires("sable", "create")
        embeds("cloth-config")
    }
}
