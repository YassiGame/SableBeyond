plugins {
    id 'com.github.johnrengelman.shadow'
}

def jadeEnabled = providers.gradleProperty("jade_enabled").map { it.toBoolean() }.getOrElse(true)
def aeronauticsEnabled = providers.gradleProperty("aeronautics_enabled").map { it.toBoolean() }.getOrElse(true)
def catalogueEnabled = providers.gradleProperty("catalogue_enabled").map { it.toBoolean() }.getOrElse(true)



architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    compileOnly "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"

    implementation("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${rootProject.ponder_version}+mc${rootProject.minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${rootProject.minecraft_version}:${rootProject.flywheel_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${rootProject.flywheel_version}")
    implementation("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}")
    if (jadeEnabled) {
        runtimeOnly("maven.modrinth:jade:${rootProject.jade_version}+neoforge")
    }
    if (aeronauticsEnabled) {
        runtimeOnly("maven.modrinth:create-aeronautics:${rootProject.aronautics_version}+mc${rootProject.minecraft_version}")
    }
    compileOnly("dev.ryanhcode.sable:sable-common-${rootProject.minecraft_version}:${rootProject.sable_version}") { transitive = false }
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${rootProject.minecraft_version}:${rootProject.sable_companion_version}"
    runtimeOnly "dev.ryanhcode.sable:sable-neoforge-${rootProject.minecraft_version}:${rootProject.sable_version}"
    implementation("com.tterrag.registrate:Registrate:${rootProject.registrate_version}")

    if (catalogueEnabled) {
        runtimeOnly "curse.maven:catalogue-459701:${rootProject.catalogue_version}"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
