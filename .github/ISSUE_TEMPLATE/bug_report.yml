name: Bug Report
description: Report a bug with the Minecraft mod.
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out the information below to help us reproduce and fix the issue.

  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "Example: When I use X block/entity/item, the game crashes or does not behave correctly."
    validations:
      required: true

  - type: checkboxes
    id: latest-version
    attributes:
      label: Latest version
      description: Please make sure you are using the latest version before reporting a bug.
      options:
        - label: I am using the latest version of the mod.
          required: true

  - type: dropdown
    id: mod-loader
    attributes:
      label: Mod loader
      description: Which mod loader are you using?
      options:
        - NeoForge
        - Fabric
      default: 0
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "Example: The block/entity/item should..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: "Example: The game crashed / nothing happened / the behavior was incorrect..."
    validations:
      required: true

  - type: upload
    id: screenshots-videos
    attributes:
      label: Screenshots or videos
      description: If applicable, upload screenshots or videos showing the bug.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: dropdown
    id: other-mods
    attributes:
      label: Other mods
      description: Are you using other mods, excluding Sable, Create and Veil?
      options:
        - "Yes"
        - "No"
      default: 1
    validations:
      required: true

  - type: textarea
    id: mod-list
    attributes:
      label: Mod list
      description: If you are using other mods, paste your mod list here.
      placeholder: "Paste your mod list here."
    validations:
      required: false

  - type: dropdown
    id: game-mode
    attributes:
      label: Singleplayer or Multiplayer
      description: Where did the bug happen?
      options:
        - Singleplayer
        - Multiplayer
        - Both
      default: 0
    validations:
      required: true

  - type: dropdown
    id: server-type
    attributes:
      label: Server type
      description: If multiplayer, what server type are you using?
      options:
        - Fabric
        - NeoForge
        - Other
    validations:
      required: false

  - type: input
    id: mclogs-link
    attributes:
      label: Logs
      description: Upload your latest.log, debug.log, or crash report to https://mclo.gs/ and paste the link here.
      placeholder: "https://mclo.gs/..."
    validations:
      required: false
